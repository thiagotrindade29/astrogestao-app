name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK (API 36)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            mkdir -p "$SDK_ROOT" 2>/dev/null || SDK_ROOT="$HOME/android-sdk"
          fi
          if [ ! -w "$SDK_ROOT" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT" 2>/dev/null || SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools..."
            TMP_ZIP="/tmp/commandlinetools.zip"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$TMP_ZIP"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q "$TMP_ZIP" -d "$SDK_ROOT/cmdline-tools"
            rm -f "$TMP_ZIP"
            if [ -d "$SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
              rm -rf "$SDK_ROOT/cmdline-tools/latest"
              mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            fi
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          [ -x "$SDKMANAGER" ] || chmod +x "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER (SDK_ROOT=$SDK_ROOT)"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          set -o pipefail

      - name: Restore Firebase config from GitHub Secrets
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys

          b64_val = os.environ.get("GOOGLE_SERVICES_JSON_BASE64", "").strip()
          raw_val = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          target_path = "app/google-services.json"

          def decode_maybe_base64(text: str) -> str:
              cleaned = text.lstrip("\ufeff").strip()
              if cleaned.startswith("{"):
                  return cleaned
              compact = "".join(cleaned.split())
              decoded = base64.b64decode(compact, validate=True).decode("utf-8").lstrip("\ufeff").strip()
              return decoded

          content = None
          if b64_val:
              try:
                  content = decode_maybe_base64(b64_val)
              except Exception:
                  print("::error::GOOGLE_SERVICES_JSON_BASE64 nao e um Base64/UTF-8 valido.")
                  sys.exit(1)
          elif raw_val:
              try:
                  content = decode_maybe_base64(raw_val)
              except Exception:
                  print("::error::GOOGLE_SERVICES_JSON nao e um JSON valido nem Base64 valido do google-services.json.")
                  sys.exit(1)
          elif os.path.isfile(target_path):
              with open(target_path, "r", encoding="utf-8-sig") as f:
                  content = f.read().strip()
          else:
              print("::error::Missing app/google-services.json. Add secret GOOGLE_SERVICES_JSON_BASE64 (or GOOGLE_SERVICES_JSON) in GitHub Repository Settings -> Secrets and variables -> Actions.")
              sys.exit(1)

          try:
              data = json.loads(content)
          except Exception as exc:
              print(f"::error::O secret do Firebase nao contem um JSON valido ({exc.__class__.__name__}). Cole o arquivo app/google-services.json completo.")
              sys.exit(1)

          if not isinstance(data, dict) or "project_info" not in data or "client" not in data:
              top_keys = list(data.keys()) if isinstance(data, dict) else []
              print(f"::error::O JSON em GOOGLE_SERVICES_JSON esta incompleto ou e o arquivo errado (chaves encontradas: {top_keys}). Ele precisa conter 'project_info' e 'client' do arquivo completo app/google-services.json (nao use firebase.json, firebase-blueprint.json ou apenas um trecho).")
              sys.exit(1)

          with open(target_path, "w", encoding="utf-8") as f:
              f.write(json.dumps(data, indent=2))
          print("Firebase google-services.json validado com sucesso (project_info e client presentes).")
          PY

      - name: Prepare signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit and Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug and Release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Package APK artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AstroGestao-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/AstroGestao-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroGestao-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AstroGestao-release.apk
            dist/AstroGestao-debug.apk
          generate_release_notes: true
